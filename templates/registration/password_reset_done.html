{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Email Sent - CineBook</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="mmt-auth-page">

    <!-- TOP HEADER -->
    <header class="mmt-header">

        <a href="{% url 'home' %}" class="mmt-logo">
            🎬 <span>Cine<span>Book</span></span>
        </a>

        <div class="mmt-header-right">
            <span>🎟️ Book Movies Easily</span>
        </div>

    </header>


    <!-- MAIN -->
    <main class="mmt-auth-main">

        <div class="mmt-auth-card">

            <div class="mmt-card-top">

                <h1>Check Your Email</h1>

                <p>
                    If an account exists with the email address
                    you entered, we have sent a password reset link.
                </p>

            </div>


            <div class="mmt-register-text">

                <p>
                    📧 Please check your inbox and spam folder.
                </p>

                <br>

                <a
                    href="{% url 'login' %}"
                    class="mmt-secondary-btn"
                >
                    ← Back to Login
                </a>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="mmt-footer">

        © 2026 CineBook · Your Movie Booking Partner

    </footer>

</body>

</html>
